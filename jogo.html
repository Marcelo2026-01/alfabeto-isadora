<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="theme-color" content="#1a252f">
    <title>O Alfabeto da Isadora - Jogo AAA</title>

    <meta property="og:title" content="O Alfabeto da Isadora - Jogo AAA">
    <meta property="og:description" content="Uma jornada mágica para aprender as letras e sílabas. Jogue agora!">
    <meta property="og:image" content="Isadora.png">
    <meta property="og:type" content="website">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icone512.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #1a252f;
            overflow: hidden; 
            font-family: 'Fredoka', sans-serif;
            user-select: none; touch-action: none; -webkit-touch-callout: none;
        }
        #game-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* LOADER PS5 */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050811;
            z-index: 999999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease;
        }
        .loader-ring {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #00f3ff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* HUD */
        #ui-layer {
            position: absolute; top: 15px; left: 5vw; 
            background: rgba(15, 25, 40, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 15px 25px;
            color: #FFF; z-index: 20; display: none; flex-direction: column;
            margin-top: 60px;
        }

        /* MENU PRINCIPAL PS5 - ATUALIZADO COM PRESENÇA DE HERÓI */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: row; align-items: center;
            z-index: 100;
            background: linear-gradient(90deg, rgba(15, 20, 30, 0.95) 0%, rgba(15, 20, 30, 0.8) 40%, rgba(15, 20, 30, 0) 100%);
            backdrop-filter: blur(8px);
        }
        .ps5-sidebar { width: 50%; padding-left: 8vw; }
        .ps5-title { font-size: clamp(28px, 6vw, 80px); color: #FFF; font-weight: 700; }
        .ps5-subtitle { font-size: clamp(14px, 3vw, 40px); color: #FF69B4; font-weight: 900; text-transform: uppercase; }
        
        .ps5-menu-options { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
        .ps5-btn {
            background: transparent; border: none; color: rgba(255, 255, 255, 0.6);
            font-size: clamp(14px, 2.5vw, 26px); font-weight: 600; text-transform: uppercase;
            cursor: pointer; padding: 10px 20px; border-radius: 8px;
            text-align: left; transition: all 0.3s;
        }
        .ps5-btn:hover, .ps5-btn.active { color: #1a1a1a; background: #FFF; transform: translateX(20px); }

        /* ÁREA DA ISADORA - GRANDE E ILUMINADA (AAA) */
        .ps5-hero-area { 
            width: 50%; height: 100%; display: flex; 
            justify-content: center; align-items: center; 
            position: relative; perspective: 1000px; 
        }
        .ps5-hero-glow { 
            position: absolute; 
            width: clamp(250px, 45vw, 600px); height: clamp(250px, 45vw, 600px); 
            background: radial-gradient(circle, rgba(255, 16, 122, 0.4) 0%, rgba(0, 216, 255, 0.2) 40%, transparent 70%); 
            border-radius: 50%; animation: pulsarLuz 3s alternate infinite ease-in-out; filter: blur(20px); 
        }
        .ps5-hero-mascot { 
            position: relative; z-index: 2; 
            width: clamp(200px, 40vw, 550px); height: clamp(250px, 50vw, 700px); 
            background-image: url('seu_personagem.png'); 
            background-size: 300% 100%; background-position: 0% 0%; background-repeat: no-repeat; 
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.8)) drop-shadow(0 0 20px rgba(255,255,255,0.2)); 
            animation: breatheMascot 4s ease-in-out infinite; 
        }

        @keyframes pulsarLuz { from { transform: scale(0.9); opacity: 0.5; } to { transform: scale(1.1); opacity: 0.8; } }
        @keyframes breatheMascot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* MENUS DE PAUSE E VITÓRIA */
        #pause-screen, #victory-screen, #exit-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 20, 30, 0.95); backdrop-filter: blur(15px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 500; gap: 15px; text-align: center;
        }
        .btn-pause-ui {
            background: #FFF; color: #000; border: none; border-radius: 8px;
            padding: 15px 40px; font-size: 20px; font-weight: bold; cursor: pointer;
            width: 300px; text-transform: uppercase;
        }

        #aviso-rotacao {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a252f; z-index: 9999; color: #FFF; text-align: center;
            flex-direction: column; justify-content: center; align-items: center;
        }

        .btn-corner {
            position: absolute; top: 15px; right: 15px;
            background: rgba(15, 25, 40, 0.5); border: 1px solid rgba(255,255,255,0.2);
            color: #FFF; padding: 10px; border-radius: 50%; z-index: 30; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="loader-ring"></div>
    <div style="color: #FFF; margin-top: 20px; font-weight: 900; letter-spacing: 2px;">CARREGANDO...</div>
</div>

<div id="game-container">
    <div id="aviso-rotacao">
        <h2>Vire o Celular</h2>
        <p>Por favor, jogue com o telemóvel deitado.</p>
    </div>

    <button id="btn-pause" class="btn-corner" style="display: none;">||</button>

    <div id="ui-layer">
        <span id="meta-alfabeto" style="color: #FFD700;">ATO I: ALFABETO</span>
        <span id="letra-ui" style="font-size: 24px; font-weight: 900;">Aguardando início...</span>
        <div style="width: 100%; height: 10px; background: #000; border-radius: 5px; margin-top: 10px;">
            <div id="progress-fill" style="width: 0%; height: 100%; background: #FF69B4; border-radius: 5px; transition: 0.3s;"></div>
        </div>
    </div>

    <div id="start-screen">
        <div class="ps5-sidebar">
            <h1 class="ps5-title">O ALFABETO</h1>
            <h2 class="ps5-subtitle">DA ISADORA</h2>
            <div class="ps5-menu-options">
                <button id="btn-jogar" class="ps5-btn active">▶ Iniciar Jogo</button>
                <button id="btn-modo" class="ps5-btn">✦ Modo: Campanha</button>
                <button id="btn-sair-menu" class="ps5-btn">✖ Sair do Jogo</button>
            </div>
        </div>
        <div class="ps5-hero-area">
            <div class="ps5-hero-glow"></div>
            <div class="ps5-hero-mascot"></div>
        </div>
    </div>

    <div id="pause-screen">
        <h1 style="color: #FFF; font-size: 50px;">PAUSADO</h1>
        <button id="btn-continuar" class="btn-pause-ui">Continuar</button>
        <button id="btn-voltar-menu" class="btn-pause-ui">Menu Principal</button>
    </div>

    <div id="exit-screen">
        <div style="background: rgba(20,25,40,0.8); padding: 40px; border-radius: 20px; border: 1px solid #FF107A;">
            <h1 style="color: #FF107A; margin-bottom: 20px;">SISTEMA</h1>
            <p style="color: #FFF; margin-bottom: 30px;">Para sair, feche esta aba no seu navegador.</p>
            <button id="btn-cancelar-sair" class="btn-pause-ui">Voltar</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // VARIÁVEIS DO JOGO E FANTASMA
    let gameActive = false;
    let isPaused = false;
    let faseAtual = 1;
    let runStartTime = 0;
    let currentRunData = [];
    let bestGhostData = JSON.parse(localStorage.getItem('isadora_ghost_ato1')) || [];
    let scaleMultiplier = 1;

    const playerSprite = new Image(); playerSprite.src = 'seu_personagem.png';
    const player = { x: 100, y: 0, vy: 0, scale: 0.28, espacoVazio: 0.25 };

    // INICIAR JOGO
    document.getElementById('btn-jogar').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';
        document.getElementById('btn-pause').style.display = 'block';
        
        runStartTime = performance.now();
        currentRunData = [];
        gameActive = true;
        animate();
    });

    // SAÍDA PS5
    document.getElementById('btn-sair-menu').addEventListener('click', () => {
        document.getElementById('exit-screen').style.display = 'flex';
    });
    document.getElementById('btn-cancelar-sair').addEventListener('click', () => {
        document.getElementById('exit-screen').style.display = 'none';
    });

    // MOTOR DE ANIMAÇÃO BÁSICO
    function animate() {
        if (!gameActive || isPaused) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Desenha Chão Simples
        ctx.fillStyle = "#222";
        ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

        // Lógica do Fantasma
        if (faseAtual === 1 && bestGhostData.length > 0) {
            let elapsed = performance.now() - runStartTime;
            let ghostScore = bestGhostData.filter(t => elapsed > t).length;
            let ghostX = 100 + (ghostScore * 10);
            
            ctx.save();
            ctx.globalAlpha = 0.4;
            ctx.filter = 'sepia(1) hue-rotate(150deg) brightness(1.5)';
            if(playerSprite.complete) ctx.drawImage(playerSprite, 0, 0, 200, 400, ghostX, canvas.height - 250, 100, 200);
            ctx.restore();
        }

        requestAnimationFrame(animate);
    }

    // REDIMENSIONAMENTO
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // REMOVER LOADER
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 600);
        }, 1000);
    };
</script>

</body>
</html>
